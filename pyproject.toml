[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multy-acc-gmail-mcp"
version = "0.1.0"
description = "Local multi-account Gmail MCP with macOS Keychain authentication"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=2,<3",
  "google-api-python-client>=2.150,<3",
  "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2",
  "google-auth-httplib2>=0.2,<1",
  "keyring>=25,<27",
]

[project.scripts]
multy-acc-gmail-mcp = "multy_acc_gmail_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
